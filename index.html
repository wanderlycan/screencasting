<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backseat P2P - Master Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --panel: #151921; --text: #e1e1e1; --success: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Retrátil */
        .sidebar { width: 300px; background: #0f1218; border-right: 1px solid #1e2530; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
        .sidebar-header { padding: 20px; background: #1a202c; border-bottom: 2px solid var(--primary); }
        
        .server-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .server-item { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #333; cursor: pointer; }

        .viewer-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        
        .top-bar { padding: 0 15px; background: #161a22; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; height: 60px; z-index: 10; }
        
        /* Botão de Menu (Hamburguer) */
        .btn-toggle { background: var(--primary); color: #000; border: none; width: 42px; height: 40px; border-radius: 8px; font-size: 1.4em; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; }
        .btn-toggle.hidden-mobile { opacity: 0; pointer-events: none; }

        /* Botão Flutuante para Fechar o Menu Mobile */
        #btn-toggle-float { position: fixed; top: 10px; left: 10px; z-index: 2500; display: none; }
        
        @media (max-width: 768px) {
            .sidebar.collapsed ~ #btn-toggle-float { display: none !important; }
            .sidebar:not(.collapsed) ~ #btn-toggle-float { display: flex !important; } 
        }

        /* AÇÕES DA TOP BAR (Direita) */
        .top-bar-actions { display: flex; align-items: center; gap: 12px; position: relative; z-index: 15; }

        /* BOTÕES DA TOP BAR */
        .top-btn { background: none; border: none; color: #fff; font-size: 1.3em; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; transition: background 0.2s; }
        .top-btn:hover { background: rgba(255, 255, 255, 0.08); }

        /* PAINEL DE AUDIO FLUTUANTE */
        .audio-wrapper { position: relative; display: flex; align-items: center; }
        #audio-led { width: 8px; height: 8px; background: #333; border-radius: 50%; position: absolute; top: 6px; right: 6px; pointer-events: none; }
        .led-active { background: var(--success) !important; box-shadow: 0 0 8px var(--success); }

        .audio-dropdown { position: absolute; top: 50px; right: 0; background: #1a202c; border: 1px solid #333; padding: 12px 15px; border-radius: 10px; display: none; flex-direction: column; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 3000; min-width: 180px; }
        .audio-dropdown.show { display: flex; }
        .audio-dropdown label { font-size: 0.75em; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .audio-dropdown input[type="range"] { width: 100%; margin: 0; cursor: pointer; }

        /* SELETOR DE JANELAS (FIXED) */
        #source-picker { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; flex-direction: column; padding: 40px; z-index: 9999; overflow-y: auto; align-items: center; }
        .source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; margin-top: 20px; }
        .source-card { background: #252d3d; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; border: 2px solid transparent; transition: 0.2s; }
        .source-card:hover { border-color: var(--primary); transform: scale(1.05); }
        .source-card img { width: 100%; border-radius: 4px; margin-bottom: 5px; }
        .source-card span { font-size: 11px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .stage { flex-grow: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
        #local-preview { width: 120px; position: absolute; bottom: 20px; right: 20px; border: 2px solid var(--primary); border-radius: 8px; z-index: 100; display: none; }

        input[type="text"] { background: #1a202c; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; width: 100%; margin-bottom: 8px; }
        .btn-host { background: var(--primary); color: #000; padding: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
        #btn-stop { background: #ff4d4d !important; color: white; display: none; }

        #click-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }
    </style>
</head>
<body>
    <!-- Seletor de Janelas -->
    <div id="source-picker">
        <h2 style="color:var(--primary);">📺 O QUE VOCÊ QUER TRANSMITIR?</h2>
        <div class="source-grid" id="source-grid"></div>
        <button onclick="document.getElementById('source-picker').style.display='none'" style="margin-top:20px; background:#444; color:#fff; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">Cancelar</button>
    </div>

    <!-- Barra Lateral -->
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <h3 style="margin:0 0 10px 0; color:var(--primary);">🕹️ BACKSEAT P2P</h3>
            <input type="text" id="host-name" placeholder="Nick da Sala">
            <button class="btn-host" id="btn-start" onclick="hostGame()">CRIAR SALA</button>
            <button class="btn-host" id="btn-stop" onclick="location.reload()">FECHAR SALA</button>
        </div>
        <div class="server-list" id="server-list"></div>
    </div>

    <!-- Botão Flutuante para Fechar o Menu Mobile -->
    <button class="btn-toggle" id="btn-toggle-float" onclick="toggleSidebar()" title="Fechar Menu">
        ✕
    </button>

    <!-- Container Principal -->
    <div class="viewer-container">
        <div class="top-bar">
            <!-- Botão de Menu Original -->
            <button class="btn-toggle" id="btn-toggle-org" onclick="toggleSidebar()">☰</button>
            
            <div id="status-text" style="font-size: 0.8em; color: #888;">Online</div>
            
            <div class="top-bar-actions">
                <button class="top-btn" onclick="handleDownload()" title="Baixar / Download">📥</button>
                <div class="audio-wrapper">
                    <button class="top-btn" onclick="toggleAudioMenu(event)" title="Configurações de Áudio">
                        🔊
                        <div id="audio-led"></div>
                    </button>
                    <div class="audio-dropdown" id="audio-dropdown" onclick="event.stopPropagation()">
                        <label>Volume do Áudio</label>
                        <input type="range" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('remote-video').volume = this.value">
                    </div>
                </div>
                <button class="top-btn" onclick="document.getElementById('main-stage').requestFullscreen()" title="Tela Cheia">⛶</button>
            </div>
        </div>

        <div class="stage" id="main-stage">
            <div id="click-overlay" onclick="unmuteVideo()">
                <div style="font-size: 3em; margin-bottom: 15px;">🎮</div>
                <button style="background: var(--primary); color: #000; padding: 15px 30px; font-size: 1.2em; border-radius:8px; border:none; font-weight:bold;">ENTRAR NA PARTIDA</button>
            </div>
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-preview" autoplay playsinline muted></video>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBIT8Yvb0rblzxL-5uMre04on0MkUxSxbo",
            authDomain: "banded-splicer-381114.firebaseapp.com",
            databaseURL: "https://banded-splicer-381114-default-rtdb.firebaseio.com",
            projectId: "banded-splicer-381114",
            storageBucket: "banded-splicer-381114.firebasestorage.app",
            messagingSenderId: "1094034826066",
            appId: "1:1094034826066:web:85597ac00127422631108b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
        const myId = Math.random().toString(36).substring(7);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btnOrg = document.getElementById('btn-toggle-org');
            
            sidebar.classList.toggle('collapsed');
            
            if (!sidebar.classList.contains('collapsed')) {
                btnOrg.classList.add('hidden-mobile');
            } else {
                btnOrg.classList.remove('hidden-mobile');
            }
        }

        // --- CONTROLE DO MENU DE ÁUDIO ---
        function toggleAudioMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('audio-dropdown');
            dropdown.classList.toggle('show');
        }

        window.addEventListener('click', () => {
            const dropdown = document.getElementById('audio-dropdown');
            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        });

        function handleDownload() {
            window.open('https://github.com/wanderlycan/screencasting/releases/latest', '_blank');
        }

        let audioCtx;
        function startLED(stream) {
            try {
                if (!stream || stream.getAudioTracks().length === 0) return;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 32;
                const data = new Uint8Array(analyser.frequencyBinCount);
                const led = document.getElementById('audio-led');
                function pulse() {
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a,b) => a+b) / data.length;
                    if (vol > 10) led.classList.add('led-active'); else led.classList.remove('led-active');
                    requestAnimationFrame(pulse);
                }
                pulse();
            } catch(e) {}
        }

        // --- HOST ---
        let localStream;
        async function hostGame() {
            const name = document.getElementById('host-name').value || "Host";
            try {
                if (typeof require !== 'undefined') {
                    const { ipcRenderer } = require('electron');
                    const sources = await ipcRenderer.invoke('get-sources');

                    const picker = document.getElementById('source-picker');
                    const grid = document.getElementById('source-grid');
                    grid.innerHTML = '';
                    picker.style.display = 'flex';

                    sources.forEach(source => {
                        if (source.name.includes("Backseat P2P")) return;
                        const card = document.createElement('div');
                        card.className = 'source-card';
                        card.innerHTML = `<img src="${source.thumbnail}"><span>${source.name}</span>`;
                        card.onclick = () => startCapture(source.id, name);
                        grid.appendChild(card);
                    });
                } else {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
                        audio: true
                    });
                    finalizeHost(stream, name);
                }
            } catch (e) { alert("Erro ao abrir: " + e.message); }
        }

        async function startCapture(sourceId, name) {
            try {
                document.getElementById('source-picker').style.display = 'none';
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { mandatory: { chromeMediaSource: 'desktop' } },
                    video: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: sourceId,
                            minWidth: 1280, maxWidth: 1920, minHeight: 720, maxHeight: 1080
                        }
                    }
                });
                finalizeHost(stream, name);
            } catch (e) { alert("Erro ao capturar: " + e.message); }
        }

        function finalizeHost(stream, name) {
            localStream = stream;
            document.getElementById('local-preview').srcObject = localStream;
            document.getElementById('local-preview').style.display = 'block';
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';
            startLED(localStream);
            
            // Limpa conexões antigas do Firebase antes de registrar para evitar conflito de handshake
            const roomRef = db.ref('rooms/' + myId);
            roomRef.set({ name: name, id: myId });
            roomRef.onDisconnect().remove();

            // Remove listeners antigos para evitar duplicação do aperto de mão
            const connectionsRef = roomRef.child('connections');
            connectionsRef.off();
            connectionsRef.on('child_added', snap => {
                if (snap.val() && snap.val().request) {
                    setupHostPeer(snap.key);
                }
            });

            // Fecha a barra lateral de forma segura após iniciar
            setTimeout(() => {
                if(window.innerWidth < 768) {
                    const sidebar = document.getElementById('sidebar');
                    if(!sidebar.classList.contains('collapsed')) toggleSidebar();
                }
            }, 200);
        }

        async function setupHostPeer(viewerId) {
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${myId}/connections/${viewerId}`);
            
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }

            pc.onicecandidate = e => { 
                if (e.candidate) ref.child('hostCandidates').push(e.candidate.toJSON()); 
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await ref.update({ offer: { type: offer.type, sdp: offer.sdp } });

                ref.child('answer').on('value', async snap => {
                    const answerVal = snap.val();
                    if (answerVal && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(answerVal));
                    }
                });

                ref.child('viewerCandidates').on('child_added', snap => {
                    const candidateVal = snap.val();
                    if (candidateVal) {
                        pc.addIceCandidate(new RTCIceCandidate(candidateVal)).catch(e => {});
                    }
                });
            } catch(err) {
                console.error("Erro no setupHostPeer:", err);
            }
        }

        // --- VIEWER ---
        db.ref('rooms').on('value', snap => {
            const list = document.getElementById('server-list');
            list.innerHTML = "";
            const rooms = snap.val();
            if (!rooms) return;
            for (let id in rooms) {
                if (id === myId) continue;
                const div = document.createElement('div');
                div.className = "server-item";
                div.innerText = rooms[id].name;
                div.onclick = () => { 
                    connect(id); 
                    if(window.innerWidth < 768) toggleSidebar(); 
                };
                list.appendChild(div);
            }
        });

        async function connect(hostId) {
            const viewerId = Math.random().toString(36).substring(7);
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${hostId}/connections/${viewerId}`);

            pc.ontrack = e => {
                const vid = document.getElementById('remote-video');
                vid.srcObject = e.streams[0];
                startLED(e.streams[0]);
                vid.play().catch(() => document.getElementById('click-overlay').style.display = 'flex');
            };

            pc.onicecandidate = e => { 
                if (e.candidate) ref.child('viewerCandidates').push(e.candidate.toJSON()); 
            };

            await ref.set({ request: true });

            ref.child('offer').on('value', async snap => {
                const offerVal = snap.val();
                if (offerVal && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(offerVal));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await ref.update({ answer: { type: answer.type, sdp: answer.sdp } });
                }
            });

            ref.child('hostCandidates').on('child_added', snap => {
                const candidateVal = snap.val();
                if (candidateVal) {
                    pc.addIceCandidate(new RTCIceCandidate(candidateVal)).catch(e => {});
                }
            });
        }

        function unmuteVideo() { 
            if(audioCtx) audioCtx.resume(); 
            document.getElementById('remote-video').play(); 
            document.getElementById('click-overlay').style.display = 'none'; 
        }
    </script>
</body>
</html>
