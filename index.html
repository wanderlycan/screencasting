<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backseat P2P - High Quality</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --panel: #151921; --text: #e1e1e1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #0f1218; border-right: 1px solid #1e2530; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background: #1a202c; border-bottom: 2px solid var(--primary); }
        .server-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .server-item { background: var(--panel); padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #333; cursor: pointer; transition: 0.2s; }
        .server-item:hover { transform: translateX(5px); background: #1c232e; }
        .viewer-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .top-bar { padding: 10px 20px; background: #161a22; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .stage { flex-grow: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #remote-video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
        #local-preview { width: 150px; position: absolute; bottom: 20px; right: 20px; border: 2px solid var(--primary); border-radius: 8px; z-index: 100; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        #debug-log { position: absolute; bottom: 20px; left: 20px; width: 250px; height: 120px; background: rgba(0,0,0,0.8); font-size: 10px; padding: 10px; border-radius: 5px; overflow-y: auto; border: 1px solid #333; color: #00ff88; pointer-events: none; z-index: 200; font-family: monospace; opacity: 0.7; }
        input { background: #1a202c; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        button { padding: 8px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-host { background: var(--primary); color: #000; width: 100%; }
        #click-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }
        .btn-fullscreen { background: rgba(255,255,255,0.1); color: white; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3 style="margin:0; color:var(--primary);">🕹️ BACKSEAT P2P</h3>
            <p style="font-size: 9px; color: #888; margin-top: 4px;">Ultra High Definition Mode</p>
            <input type="text" id="host-name" placeholder="Nome da Sala">
            <button class="btn-host" id="btn-start" onclick="hostGame()">CRIAR SALA</button>
            <button class="btn-host" id="btn-stop" style="display:none; background:#ff4d4d;" onclick="location.reload()">FECHAR SALA</button>
        </div>
        <div class="server-list" id="server-list"></div>
    </div>

    <div class="viewer-container">
        <div class="top-bar">
            <div id="status-text">Sistema pronto para gameplay.</div>
            <button class="btn-fullscreen" onclick="document.getElementById('main-stage').requestFullscreen()">⛶ TELA CHEIA</button>
        </div>
        <div class="stage" id="main-stage">
            <div id="debug-log"></div>
            <div id="click-overlay" onclick="unmuteVideo()">
                <div style="font-size: 3em; margin-bottom: 10px;">🎮</div>
                <button style="background: var(--primary); color: #000; padding: 15px 30px; font-size: 1.2em;">ENTRAR NA PARTIDA</button>
                <p style="margin-top: 15px; font-size: 0.9em; color: #888;">(Necessário para ativar som e vídeo)</p>
            </div>
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-preview" autoplay playsinline muted style="display:none"></video>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBIT8Yvb0rblzxL-5uMre04on0MkUxSxbo",
            authDomain: "banded-splicer-381114.firebaseapp.com",
            databaseURL: "https://banded-splicer-381114-default-rtdb.firebaseio.com",
            projectId: "banded-splicer-381114",
            storageBucket: "banded-splicer-381114.firebasestorage.app",
            messagingSenderId: "1094034826066",
            appId: "1:1094034826066:web:85597ac00127422631108b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ]
        };

        const myId = Math.random().toString(36).substring(7);
        const logBox = document.getElementById('debug-log');
        const statusText = document.getElementById('status-text');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- HOST ---
        let localStream;
        async function hostGame() {
            try {
                // Configuração para Máxima Qualidade
                const constraints = {
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 },
                        cursor: "always"
                    },
                    audio: {
                        autoGainControl: false,
                        echoCancellation: false,
                        noiseSuppression: false
                    }
                };

                localStream = await navigator.mediaDevices.getDisplayMedia(constraints);
                document.getElementById('local-preview').srcObject = localStream;
                document.getElementById('local-preview').style.display = 'block';
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('btn-stop').style.display = 'block';

                const name = document.getElementById('host-name').value || "Host";
                db.ref('rooms/' + myId).set({ name, id: myId });
                db.ref('rooms/' + myId).onDisconnect().remove();

                log("Transmitindo em Alta Definição...");
                db.ref(`rooms/${myId}/connections`).on('child_added', snap => setupHostPeer(snap.key));
            } catch (e) { log("Erro: " + e.message); }
        }

        async function setupHostPeer(viewerId) {
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${myId}/connections/${viewerId}`);

            localStream.getTracks().forEach(t => {
                const sender = pc.addTrack(t, localStream);
                // Dica de bitrate para o navegador
                if (t.kind === 'video') {
                    const parameters = sender.getParameters();
                    if (!parameters.encodings) parameters.encodings = [{}];
                    parameters.encodings[0].maxBitrate = 8000000; // 8 Mbps
                    sender.setParameters(parameters).catch(e => console.warn(e));
                }
            });

            pc.onicecandidate = e => { if (e.candidate) ref.child('hostCandidates').push(e.candidate.toJSON()); };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await ref.update({ offer: { type: offer.type, sdp: offer.sdp } });

            ref.child('answer').on('value', async snap => {
                const answer = snap.val();
                if (answer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    log("Espectador conectado!");
                }
            });

            ref.child('viewerCandidates').on('child_added', snap => {
                pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
            });
        }

        // --- VIEWER ---
        db.ref('rooms').on('value', snap => {
            const list = document.getElementById('server-list');
            list.innerHTML = "";
            const rooms = snap.val();
            for (let id in rooms) {
                if (id === myId) continue;
                const div = document.createElement('div');
                div.className = "server-item";
                div.innerText = rooms[id].name;
                div.onclick = () => connect(id);
                list.appendChild(div);
            }
        });

        async function connect(hostId) {
            log("Entrando na sala...");
            const viewerId = Math.random().toString(36).substring(7);
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${hostId}/connections/${viewerId}`);

            pc.ontrack = e => {
                log("Fluxo recebido. Sincronizando áudio/vídeo...");
                const vid = document.getElementById('remote-video');
                vid.srcObject = e.streams[0];
                vid.play().catch(() => document.getElementById('click-overlay').style.display = 'flex');
            };

            pc.onicecandidate = e => { if (e.candidate) ref.child('viewerCandidates').push(e.candidate.toJSON()); };

            await ref.update({ status: 'init' });

            ref.child('offer').on('value', async snap => {
                const offer = snap.val();
                if (offer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await ref.update({ answer: { type: answer.type, sdp: answer.sdp } });
                }
            });

            ref.child('hostCandidates').on('child_added', snap => {
                pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
            });
        }

        function unmuteVideo() {
            const vid = document.getElementById('remote-video');
            vid.play();
            document.getElementById('click-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
