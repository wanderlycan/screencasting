<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Backseat P2P - Pro Mobile UX</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #00d4ff; --bg: #0b0e14; --panel: #151921; --text: #e1e1e1; --success: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Retrátil */
        .sidebar {
            width: 300px; background: #0f1218; border-right: 1px solid #1e2530;
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 2000;
        }
        .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }

        .sidebar-header { padding: 20px; background: #1a202c; border-bottom: 2px solid var(--primary); min-width: 300px; }
        .server-list { flex-grow: 1; overflow-y: auto; padding: 10px; min-width: 300px; }
        .server-item { background: var(--panel); padding: 18px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #333; cursor: pointer; transition: 0.2s; }

        /* Viewer Container */
        .viewer-container { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; }

        .top-bar {
            padding: 0 10px; background: #161a22;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #333; height: 60px; gap: 5px;
        }

        .stage { flex-grow: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
        #local-preview { width: 100px; position: absolute; bottom: 20px; right: 20px; border: 2px solid var(--primary); border-radius: 8px; z-index: 100; }

        /* Botões Estilizados */
        .btn-toggle {
            background: var(--primary); color: #000; border: none;
            width: 42px; height: 42px; border-radius: 10px;
            font-size: 1.4em; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .audio-controls { display: flex; align-items: center; gap: 8px; background: #111; padding: 5px 12px; border-radius: 20px; border: 1px solid #333; }
        #audio-led { width: 12px; height: 12px; background: #333; border-radius: 50%; transition: 0.1s; }
        .led-active { background: var(--success) !important; box-shadow: 0 0 10px var(--success); }
        input[type=range] { width: 60px; accent-color: var(--primary); cursor: pointer; }

        input { background: #1a202c; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        .btn-host { background: var(--primary); color: #000; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; width: 100%; }

        #click-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }

        /* ========================================== */
        /* ESTRATÉGIA MOBILE: BARRA PERSISTENTE NO TOPO */
        /* ========================================== */
        @media (max-width: 768px) {
            .top-bar { height: 60px; padding: 0 10px; }
            .sidebar { position: fixed; height: 100%; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .sidebar.collapsed { transform: translateX(-100%); width: 300px; }
            #status-text { display: none; }
            input[type=range] { width: 70px; }
        }
    </style>
</head>
<body>
    <!-- Sidebar Retrátil -->
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <h3 style="margin:0 0 10px 0; color:var(--primary);">🕹️ BACKSEAT P2P</h3>
            <input type="text" id="host-name" placeholder="Nick da Sala">
            <button class="btn-host" id="btn-start" onclick="hostGame()">CRIAR SALA</button>
            <button class="btn-host" id="btn-stop" style="display:none; background:#ff4d4d;" onclick="location.reload()">FECHAR SALA</button>
        </div>
        <div class="server-list" id="server-list"></div>
    </div>

    <!-- Container Principal -->
    <div class="viewer-container">
        <!-- Barra de Ferramentas (No topo no PC, no rodapé no Mobile) -->
        <div class="top-bar">
            <button class="btn-toggle" onclick="toggleSidebar()">☰</button>

            <div id="status-text" style="font-size: 0.8em; color: #888;">P2P Pronto</div>

            <div class="audio-controls">
                <input type="range" min="0" max="1" step="0.1" value="1" oninput="document.getElementById('remote-video').volume = this.value">
                <div id="audio-led"></div>
            </div>

            <button onclick="document.getElementById('main-stage').requestFullscreen()" style="background:none; border:none; color:#fff; font-size: 1.5em; cursor:pointer;">⛶</button>
        </div>

        <!-- Área do Vídeo -->
        <div class="stage" id="main-stage">
            <div id="click-overlay" onclick="unmuteVideo()">
                <div style="font-size: 3em; margin-bottom: 15px;">🎮</div>
                <button style="background: var(--primary); color: #000; padding: 15px 30px; font-size: 1.2em; border-radius:12px; border:none; font-weight:bold; cursor:pointer;">ASSISTIR AGORA</button>
            </div>
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-preview" autoplay playsinline muted style="display:none"></video>
        </div>
    </div>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBIT8Yvb0rblzxL-5uMre04on0MkUxSxbo",
            authDomain: "banded-splicer-381114.firebaseapp.com",
            databaseURL: "https://banded-splicer-381114-default-rtdb.firebaseio.com",
            projectId: "banded-splicer-381114",
            storageBucket: "banded-splicer-381114.firebasestorage.app",
            messagingSenderId: "1094034826066",
            appId: "1:1094034826066:web:85597ac00127422631108b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
        const myId = Math.random().toString(36).substring(7);

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // --- LÓGICA DO LED ---
        let audioCtx;
        function startLED(stream) {
            try {
                if (!stream || stream.getAudioTracks().length === 0) return;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 32;
                const data = new Uint8Array(analyser.frequencyBinCount);
                const led = document.getElementById('audio-led');
                function pulse() {
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a,b) => a+b) / data.length;
                    if (vol > 10) { led.classList.add('led-active'); led.style.opacity = Math.min(vol/40, 1); }
                    else { led.classList.remove('led-active'); led.style.opacity = "0.3"; }
                    requestAnimationFrame(pulse);
                }
                pulse();
            } catch(e) {}
        }

        // --- HOST ---
        let localStream;
        async function hostGame() {
            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 }, cursor: "always" },
                    audio: { autoGainControl: false, echoCancellation: false, noiseSuppression: false }
                });
                document.getElementById('local-preview').srcObject = localStream;
                document.getElementById('local-preview').style.display = 'block';
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('btn-stop').style.display = 'block';
                startLED(localStream);
                db.ref('rooms/' + myId).set({ name: document.getElementById('host-name').value || "Host", id: myId });
                db.ref('rooms/' + myId).onDisconnect().remove();
                db.ref(`rooms/${myId}/connections`).on('child_added', snap => setupHostPeer(snap.key));
                if(window.innerWidth < 769) toggleSidebar();
            } catch (e) { console.error(e); }
        }

        async function setupHostPeer(viewerId) {
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${myId}/connections/${viewerId}`);
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.onicecandidate = e => { if (e.candidate) ref.child('hostCandidates').push(e.candidate.toJSON()); };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await ref.update({ offer: { type: offer.type, sdp: offer.sdp } });
            ref.child('answer').on('value', async snap => {
                if (snap.val() && !pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
            });
            ref.child('viewerCandidates').on('child_added', snap => { pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {}); });
        }

        // --- VIEWER ---
        db.ref('rooms').on('value', snap => {
            const list = document.getElementById('server-list');
            list.innerHTML = "";
            const rooms = snap.val();
            if (!rooms) return;
            for (let id in rooms) {
                if (id === myId) continue;
                const div = document.createElement('div');
                div.className = "server-item";
                div.innerText = rooms[id].name;
                div.onclick = () => { connect(id); if(window.innerWidth < 769) toggleSidebar(); };
                list.appendChild(div);
            }
        });

        async function connect(hostId) {
            const viewerId = Math.random().toString(36).substring(7);
            const pc = new RTCPeerConnection(rtcConfig);
            const ref = db.ref(`rooms/${hostId}/connections/${viewerId}`);
            pc.ontrack = e => {
                const vid = document.getElementById('remote-video');
                vid.srcObject = e.streams[0];
                startLED(e.streams[0]);
                vid.play().catch(() => document.getElementById('click-overlay').style.display = 'flex');
            };
            pc.onicecandidate = e => { if (e.candidate) ref.child('viewerCandidates').push(e.candidate.toJSON()); };
            await ref.update({ status: 'init' });
            ref.child('offer').on('value', async snap => {
                const offer = snap.val();
                if (offer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await ref.update({ answer: { type: answer.type, sdp: answer.sdp } });
                }
            });
            ref.child('hostCandidates').on('child_added', snap => { pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {}); });
        }

        function unmuteVideo() {
            if(audioCtx) audioCtx.resume();
            document.getElementById('remote-video').play();
            document.getElementById('click-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
